name: pages-setup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-setup.yml']
permissions:
  pages: write
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Point Pages at main / root
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" -f "source[branch]=main" -f "source[path]=/" -f build_type=legacy && echo SWITCHED || echo SWITCH_FAILED
          gh api "repos/${{ github.repository }}/pages" || true
