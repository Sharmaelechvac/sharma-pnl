name: publish
# GitHub Pages serves the gh-pages branch. main is the branch to edit.
# Every push to main copies main onto gh-pages and publishes it. Never edit gh-pages by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy main onto gh-pages
        run: git push --force origin HEAD:refs/heads/gh-pages
      - name: Publish gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref gh-pages -R "${{ github.repository }}"
  deploy:
    if: github.ref == 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
